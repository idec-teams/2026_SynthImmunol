<script>
document.addEventListener('DOMContentLoaded', function() {
    const buttons = document.querySelectorAll('.sidebar-nav button');
    const panels = document.querySelectorAll('.content-panel');
    
    buttons.forEach(button => {
        button.addEventListener('click', function() {
            const section = this.dataset.section;
            const targetPanel = document.getElementById(`section-${section}`);
            
            // 检查当前按钮是否已经是激活状态（即内容已展开）
            const isActive = this.classList.contains('active');
            
            if (isActive) {
                // ===== 如果按钮已激活，执行收回操作 =====
                
                // 移除当前按钮的 active 和 shift-right 类
                this.classList.remove('active', 'shift-right');
                
                // 隐藏对应的内容面板
                if (targetPanel) {
                    targetPanel.classList.remove('active');
                }
                
            } else {
                // ===== 如果按钮未激活，执行展开操作 =====
                
                // 移除所有按钮的 active 和 shift-right 类
                buttons.forEach(btn => {
                    btn.classList.remove('active', 'shift-right');
                });
                
                // 隐藏所有内容面板
                panels.forEach(panel => {
                    panel.classList.remove('active');
                });
                
                // 激活当前按钮
                this.classList.add('active', 'shift-right');
                
                // 显示对应的内容面板
                if (targetPanel) {
                    targetPanel.classList.add('active');
                }
            }
        });
    });
});
</script>
